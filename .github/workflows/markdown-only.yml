name: Markdown only

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any non-Markdown file exists
        run: |
          # Every tracked file except .md files, the workflow definitions, and CODEOWNERS
          bad=$(git ls-files | grep -v '\.md$' | grep -v '^\.github/workflows/' | grep -v '^\.github/CODEOWNERS$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Only Markdown (.md) files are allowed. Remove these files:"
            echo "$bad"
            exit 1
          fi
          echo "All files are Markdown."
